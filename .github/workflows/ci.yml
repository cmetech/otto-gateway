# OTTO Gateway — CI gate (Phase 9 SC3).
#
# Runs the same trust-gate suite the local `make ci` already executes,
# plus a cross-compile smoke that confirms every supported OS/arch
# still builds clean from a single host. Gates pushes to main and PRs
# targeting main. Single-job sequential rather than matrix because
# the workflow is fast (<5 min on cached runners) and the linear
# output is easier to read in PR review.
#
# Why the version pin policy: actions/setup-go reads go.mod for the Go
# version (go-version-file), which keeps the workflow in sync with
# whatever the repo declares. golangci-lint, go-arch-lint, and
# govulncheck are pinned to specific versions so a release in any of
# them does not break CI overnight — bump them deliberately when
# upgrading the local make-target tooling.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a newer commit lands.
# Prevents stacked CI cost on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned tool versions. Bump together with the local toolchain.
  # golangci-lint v2.x required because .golangci.yml uses v2 schema;
  # v1.x silently fails to load the config and reports a confusing
  # Go-version error instead.
  GOLANGCI_LINT_VERSION: v2.12.2
  GO_ARCH_LINT_VERSION:  v1.15.0
  GOVULNCHECK_VERSION:   v1.1.4
  NODE_VERSION:          '22'

jobs:
  privacy-posix:
    name: privacy parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Focused privacy conformance, benchmark, and POSIX parity
        shell: bash
        run: make test-privacy

      - name: Focused privacy race gate
        if: runner.os == 'Linux'
        shell: bash
        run: make test-privacy-race

  support-powershell-windows:
    name: privacy + support parity (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Parse PowerShell 5.1 sources
        shell: powershell
        run: |
          $files = @(
            'scripts/install.ps1',
            'scripts/gw.ps1',
            'scripts/test-pii.ps1',
            'scripts/lib/redact.ps1',
            'scripts/lib/support-safe-open.ps1',
            'tests/install/privacy_secrets_windows_test.ps1',
            'tests/install/windows_nonadmin_acl_test.ps1',
            'tests/install/windows_installer_test.ps1',
            'tests/scripts/test-privacy-cli.ps1',
            'tests/scripts/test-support-bundle.ps1',
            'tests/scripts/test-support-redact.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }

      - name: Non-administrator managed-secret ACL lifecycle
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/install/windows_nonadmin_acl_test.ps1

      - name: PowerShell installer failure propagation
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/install/windows_installer_test.ps1

      - name: PowerShell privacy secret lifecycle
        shell: pwsh
        run: pwsh -NoProfile -File tests/install/privacy_secrets_windows_test.ps1

      - name: PowerShell privacy CLI parity
        shell: pwsh
        run: pwsh -NoProfile -File tests/scripts/test-privacy-cli.ps1

      - name: PowerShell PII smoke help
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-pii.ps1 -Help | Out-Null

      - name: PowerShell support redaction
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/scripts/test-support-redact.ps1

      - name: PowerShell support integration and reparse races
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/scripts/test-support-bundle.ps1

      - name: Native Windows tray observability and cancellation tests
        shell: powershell
        run: go test ./cmd/otto-tray -run 'RemoteWrite|MetricsRW|WrapperCancellation' -count=1

  lint-test-arch:
    name: lint + test-race + arch-lint + govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Phase 08.1 WARNING-01: explicit trust-gate sequence per
      # docs/briefs/go_port_brief.md §3.12. The local Makefile holds the
      # canonical sequence (`make ci`); CI duplicates the leading steps
      # (gofumpt -d → go vet → go build) for in-log readability before
      # delegating golangci-lint + arch-lint + test-race to the action /
      # make targets below. Keeping both sides explicit prevents drift
      # — see Phase 08.1 D-16.
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Format check (gofumpt -d)
        run: |
          set -euo pipefail
          diff="$(gofumpt -d .)"
          if [ -n "$diff" ]; then
            echo "FAIL: gofumpt reports formatting diffs (brief §3.12 step 1):"
            echo "$diff"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build (host)
        run: go build ./...

      # golangci-lint via its dedicated action so it brings its own
      # binary cache and version pin in one place. `make lint` calls
      # `golangci-lint run ./...` directly; this action covers that
      # invocation without re-installing the binary.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Install go-arch-lint
        run: |
          go install github.com/fe3dback/go-arch-lint@${{ env.GO_ARCH_LINT_VERSION }}

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Test (-race)
        run: make test-race

      - name: Dashboard JavaScript behavior test
        run: make test-admin-js

      - name: Metrics remote-write defaults acceptance
        run: bash tests/scripts/test-metrics-remote-write-defaults.sh

      # Brief §3.12 step 7 — Example tests. Surfaced as its own step so
      # broken godoc-runnable examples fail with a clear log line rather
      # than being buried inside the test-race batch (Phase 08.1 D-16).
      - name: Example tests
        run: go test -run Example ./...

      - name: Architecture boundaries
        # `make arch-lint` invokes the binary via $(go env GOPATH)/bin
        # which is on PATH after go install (setup-go arranges this).
        run: make arch-lint

      - name: Vulnerability scan
        run: govulncheck ./...

  # Lints the darwin build arm, which ubuntu-latest structurally cannot see.
  # cmd/otto-tray is //go:build darwin || windows and seven of its files are
  # darwin-only (desktop_darwin.go, openfolder_darwin.go, autostart_darwin.go,
  # pidfile_darwin.go, uihelpers_darwin.go, trayhooks_darwin.go,
  # desktopconsole_darwin.go). On the linux runner every one is dropped by
  # build tag, so before this job they were linted nowhere — two real findings
  # (an unwrapped pgrep error, a per-GOOS unparam case) survived until a
  # developer happened to run `make lint` on a mac (quick task 260725-gp6).
  lint-darwin:
    name: golangci-lint (darwin arm)
    # macos-latest rather than ubuntu-latest with a GOOS override: golangci-lint
    # type-checks a package before any linter runs, and cmd/otto-tray pulls in
    # github.com/energye/systray, whose darwin implementation is cgo. A linux
    # host has no darwin clang/sysroot to build it, and turning cgo off does not
    # rescue it — the package then has no darwin implementation at all and the
    # load dies on undefined symbols. Same constraint the publish-dry-run job
    # below documents for `make package-all`.
    runs-on: macos-latest
    # No `needs:` — decoupled from lint-test-arch so a darwin-only regression
    # reads as its own red X in the PR check list. This is the second macOS
    # runner in the workflow; the extra minutes are the price of the build arm
    # having no coverage at all, which is how the two findings above survived.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Targeted tray observability and preference race tests
        run: go test -race ./cmd/otto-tray -run 'RemoteWrite|MetricsRW|Preference|WrapperCancellation' -count=1

      # Scope is ./... , not ./cmd/otto-tray/... . The tray holds most of the
      # darwin-tagged code but not all of it: internal/procstat/procstat_other.go
      # is `!linux && !windows`, so the linux runner compiles procstat_linux.go
      # and never sees it. ./... also keeps this identical to `make lint`, so a
      # developer's local mac run is the same command CI runs. Re-linting the
      # OS-agnostic packages lint-test-arch already covered is the cheap price.
      - name: golangci-lint (darwin)
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  cross-compile-smoke:
    name: cross-compile (darwin arm64+amd64, linux amd64, windows amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Decoupled from lint-test-arch so a failure in one surfaces
    # independently in the PR check list. Both must pass for merge.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make cross (all four targets)
        # `make cross` produces (Makefile BINARY=gateway; the source package
        # is cmd/otto-gateway but the shipped binary basename is "gateway"):
        #   bin/gateway-darwin-arm64
        #   bin/gateway-darwin-amd64
        #   bin/gateway-linux-amd64
        #   bin/gateway-windows-amd64.exe
        # All CGO_ENABLED=0 + -ldflags="-s -w" + statically linked.
        # ≤25 MB per binary (BLD-04 contract; current artifacts ~11 MB).
        run: make cross

      - name: Verify all four binaries exist
        run: |
          set -euo pipefail
          for bin in \
            bin/gateway-darwin-arm64 \
            bin/gateway-darwin-amd64 \
            bin/gateway-linux-amd64 \
            bin/gateway-windows-amd64.exe; do
            test -f "$bin" || { echo "missing: $bin" >&2; exit 1; }
            size_bytes=$(stat -c%s "$bin")
            size_mb=$(( size_bytes / 1024 / 1024 ))
            echo "$bin → ${size_mb} MB"
            # BLD-04 ≤25 MB safety net. Bumps would mean cgo/heavy
            # deps slipped in; surface here before download UX
            # regresses for end users.
            if [ "$size_mb" -gt 25 ]; then
              echo "FAIL: $bin exceeds 25 MB cap (BLD-04)" >&2
              exit 1
            fi
          done

  # Catches regressions in `make package-all` artifact naming/format by
  # exercising scripts/publish.sh in dry-run; never performs real uploads.
  # The publish script is the operator-facing entry point for pushing a
  # release set to the team Artifactory + MinIO. If its plan block can't
  # render against a fresh dist/, the release flow is broken before any
  # operator notices. Real uploads stay a manual operator action.
  publish-dry-run:
    name: publish.sh dry-run + Layer-1 tests
    # macos-latest because `make package-all` cross-compiles otto-tray
    # for darwin via cgo, which needs the system clang+sysroot. A linux
    # runner can't satisfy that — release.yml handles it by splitting
    # macos and linux build jobs. The CI dry-run job assembles the full
    # release set on one runner, so it lives on macos with mingw-w64
    # installed for the windows-tray leg.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mingw-w64 (cgo for windows tray)
        run: brew install mingw-w64

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Build full release set (make package-all)
        run: make package-all

      - name: Windows package support runtime smoke
        run: bash tests/scripts/test-windows-package-support.sh

      - name: Shellcheck publish scripts
        run: shellcheck scripts/publish.sh tests/scripts/publish_test.sh

      - name: publish.sh -n (dry-run plan only)
        run: |
          set -euo pipefail
          # CI has no Artifactory cert or MinIO alias. Import a disposable,
          # local-only alias because `mc alias set` probes its endpoint;
          # `publish.sh -n` only lists the alias and never uploads. Contract:
          # dry-run prints the plan and exits 0 given one destination.
          brew install minio-mc
          export MC_CONFIG_DIR="$(mktemp -d)"
          printf '%s\n' \
            '{"url":"http://127.0.0.1:9000","accessKey":"ci-dry-run","secretKey":"ci-dry-run","api":"S3v4","path":"auto"}' \
            | mc alias import myminio
          mc alias list myminio --json | grep -q '"status":"success"'
          out=$(./scripts/publish.sh -n 2>&1)
          echo "$out"
          echo "$out" | grep -q 'otto-gateway publish plan' \
            || { echo "FAIL: publish.sh -n did not print plan block" >&2; exit 1; }

      - name: Layer-1 dry-run test harness
        run: ./tests/scripts/publish_test.sh
